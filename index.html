// ── FIREBASE SYNC ──────────────────────────────────────────
async function loadFromFirebase() {
  try {
    setSyncStatus('syncing');
    const snapshot = await get(dbRef);
    if (snapshot.exists()) {
      col = snapshot.val() || {};
    }
    setSyncStatus('ok');
  } catch(e) {
    setSyncStatus('error');
    showToast('⚠️ Sin conexión — usando datos locales');
    const local = localStorage.getItem('adrenalyn2026');
    if (local) col = JSON.parse(local);
  }
}

async function saveToFirebase() {
  localStorage.setItem('adrenalyn2026', JSON.stringify(col));
  try {
    setSyncStatus('syncing');
    await set(dbRef, col);
    setSyncStatus('ok');
  } catch(e) {
    setSyncStatus('error');
    showToast('⚠️ Guardado local (sin conexión)');
  }
}

function setSyncStatus(s) {
  syncStatus = s;
  const dot = document.getElementById('syncDot');
  if (dot) dot.className = 'sync-dot ' + s;
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveToFirebase(), 600);
}

function sobreConfirmar(id) {
  var prevQty = col[id] || 0;

function sobreClear() {

function sobreUndo() {

function cambioSetInput(val) { cambioInput = val; cambioPrevisualize(); }

function cambioPrevisualize() {
  var n = parseInt(cambioInput);

  if (!cambioInput || isNaN(n) || n<1 || n>630 || !cardMap[n]) { area.innerHTML=''; return; }

function cambioNext() {
  var n = parseInt(cambioInput);
  if (!cambioInput || isNaN(n)) { showToast('⚠️ Introduce un número'); return; }
  if (n<1 || n>630) { showToast('⚠️ Número entre 1 y 630'); return; }
  if (!cardMap[n]) { showToast('⚠️ Número no encontrado'); return; }
  if (cambioStep==='dar') {
    if (!(col[n]>0)) { showToast('⚠️ No tienes ese cromo'); return; }
    if (col[n]===1) { showToast('⚠️ Solo tienes 1 — necesitas un repetido'); return; }
    cambioDar = cardMap[n];
    cambioStep = 'recibir';
    cambioInput = '';
  } else if (cambioStep==='recibir') {
    cambioRecibir = cardMap[n];
    cambioStep = 'confirm';
    cambioInput = '';
  }
  renderCambioPanel();
}

function cambioConfirm() {
  if (!cambioDar || !cambioRecibir) return;
  if (col[cambioDar.id]<=1) delete col[cambioDar.id]; else col[cambioDar.id]--;
  col[cambioRecibir.id] = (col[cambioRecibir.id]||0) + 1;
  scheduleSave();
  showToast('✅ Cambio realizado');
  cambioReset();
}

function cambioReset() {
  cambioStep='dar'; cambioDar=null; cambioRecibir=null; cambioInput='';
  renderCambioPanel();
}


// ── PREFS ──────────────────────────────────────────────────
function togglePref(k) {
  const n={...prefs,[k]:!prefs[k]};
  if(!n.showNum&&!n.showName&&!n.showTeam)return;
  prefs=n; localStorage.setItem('adrenalyn2026_prefs',JSON.stringify(prefs)); render();
}
function cardLabel(c) {
  let p=[];
  if(prefs.showNum)p.push(c.id);
  if(prefs.showName)p.push(c.name);
  if(prefs.showTeam)p.push('('+c.team+')');
  return p.join(' · ');
}

// ── STATS ──────────────────────────────────────────────────
function stats() {
  const owned=CL.filter(c=>col[c.id]>0);
  const missing=CL.filter(c=>!col[c.id]);
  const dupes=CL.filter(c=>col[c.id]>1);
  const extras=dupes.reduce((s,c)=>s+(col[c.id]-1),0);
  return{owned,missing,dupes,extras};
}

// ── EXPORT ──────────────────────────────────────────────────
function exportExcel() {
  const rows=CL.map(c=>({'Nº':c.id,'Jugador':c.name,'Selección':c.team,'Tipo':TYPE_LABEL[c.type]||c.type,'Cantidad':col[c.id]||0,'Estado':!col[c.id]?'FALTA':col[c.id]===1?'TENGO':`REPE x${col[c.id]-1}`}));
  const ws=XLSX.utils.json_to_sheet(rows);
  ws['!cols']=[{wch:5},{wch:30},{wch:18},{wch:18},{wch:10},{wch:12}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Colección');
  const now=new Date();const ts=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')+'_'+String(now.getHours()).padStart(2,'0')+String(now.getMinutes()).padStart(2,'0');XLSX.writeFile(wb,'Cromos_FIFA2026_'+ts+'.xlsx');
  showToast('📥 Excel exportado');
}

// ── IMPORT ──────────────────────────────────────────────────
function importExcel(file) {
  const reader=new FileReader();
  reader.onload=ev=>{
    try {
      const wb=XLSX.read(ev.target.result,{type:'binary'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws);
      const next={};let count=0;
      rows.forEach(row=>{
        const id=parseInt(row['Nº']||row['N']||row['id']||0);
        const qty=parseInt(row['Cantidad']||row['cantidad']||0);
        if(!isNaN(id)&&id>0&&qty>0){next[id]=qty;count++;}
      });
      if(count>0){col=next;saveToFirebase();showToast(`✅ Importados ${count} cromos`);showImport=false;}
      else showToast('⚠️ No se encontraron datos');
    } catch(e){showToast('⚠️ Error al leer archivo');}
    render();
  };
  reader.readAsBinaryString(file);
}

// ── TOAST ──────────────────────────────────────────────────
let toastTimer=null;
function showToast(msg) {
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t);}
  t.textContent=msg;t.style.display='block';
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.style.display='none';},2200);
}

// ── RENDER ──────────────────────────────────────────────────
function render() {
  const {owned,missing,dupes,extras}=stats();
  const pct=Math.round(owned.length/630*100);
  const byTeam={};
  CL.forEach(c=>{if(!byTeam[c.team])byTeam[c.team]=[];byTeam[c.team].push(c);});
  const teams4f=['Todas',...Array.from(new Set(CL.map(c=>c.team))).sort()];
  const listSource=curTab==='tengo'?owned:curTab==='faltan'?missing:curTab==='repes'?dupes:CL;
  const filtered=listSource.filter(c=>{
    const q=curSearch.toLowerCase();
    const mQ=!q||c.name.toLowerCase().includes(q)||String(c.id).includes(q)||c.team.toLowerCase().includes(q);
    const mT=curTeam==='Todas'||c.team===curTeam;
    return mQ&&mT;
  });

  const syncLabel = syncStatus==='syncing'?'Sincronizando...':syncStatus==='error'?'Sin conexión':'Sincronizado ✓';

  document.getElementById('app').innerHTML=`
    <div class="header">
      <div class="header-top">
        <div>
          <div class="header-title">Panini Adrenalyn XL™</div>
          <div class="header-name">FIFA World Cup 2026™</div>
          <div class="sync-status"><span class="sync-dot ${syncStatus}" id="syncDot"></span>${syncLabel}</div>
        </div>
        <div>
          <div class="header-count">${owned.length}<span style="font-size:12px;opacity:.6">/630</span></div>
          <div class="header-pct">${pct}% completado</div>
        </div>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="view-tabs">
        <button class="vtab${curView==='checklist'?' active':''}" onclick="setView('checklist')">📋</button>
        <button class="vtab${curView==='sobre'?' active':''}" onclick="setView('sobre')">📦 Sobre</button>
        <button class="vtab${curView==='cambio'?' active':''}" onclick="setView('cambio')">🔄 Cambio</button>
        <button class="vtab${curView==='lista'?' active':''}" onclick="setView('lista')">🔍</button>
        <button class="vtab vset${showPrefs?' active':''}" onclick="togglePrefsPanel()">⚙️</button>
      </div>
    </div>

    ${showPrefs?`<div class="prefs-panel">
      <div class="prefs-title">FORMATO DE VISUALIZACIÓN</div>
      ${[['showNum','Mostrar número'],['showName','Mostrar nombre'],['showTeam','Mostrar selección']].map(([k,l])=>`
        <div class="pref-row" onclick="togglePref('${k}')">
          <div class="checkbox${prefs[k]?' on':''}">✓</div>
          <span class="pref-label">${l}</span>
        </div>`).join('')}
    <div class='footer-emm'>EMM © 2026</div>
    </div>`:''}

    ${curView==='checklist'?`<div class="checklist">
      ${TEAMS_ORDER.filter(t=>byTeam[t]).map(team=>{
        const cards=byTeam[team];
        const haveCount=cards.filter(c=>col[c.id]>0).length;
        return`<div class="team-block">
          <div class="team-header">
            <span class="team-name">${team}</span>
            <span class="team-count${haveCount===cards.length?' full':''}">${haveCount}/${cards.length}</span>
          </div>
          <div class="cards-grid">
            ${cards.map(c=>{
              const qty=col[c.id]||0;
              const owned=qty>0,duped=qty>1;
              return`<button class="chip${owned?(duped?' duped':' owned'):''}" onclick="openModal(${c.id})">
                <span class="sbox">${duped?'R':owned?'✓':''}</span>
                <span>${cardLabel(c)}</span>
                ${duped?`<span class="xbadge">+${qty-1}</span>`:''}
              </button>`;
            }).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>`:''}

    ${curView==='sobre'?`<div id="sobrePanel"></div>`:''}
    ${curView==='cambio'?`<div id="cambioPanel"></div>`:''}
    ${curView==='lista'?`
    <div class="lista-controls">
      <input class="search-input" placeholder="🔍 Buscar nº, nombre o selección..." value="${curSearch}" oninput="setSearch(this.value)">
      <select class="team-select" onchange="setTeam(this.value)">
        ${teams4f.map(t=>`<option${t===curTeam?' selected':''}>${t}</option>`).join('')}
      </select>
      <div class="subtabs">
        <button class="stab st${curTab==='todos'?' active':''}" onclick="setTab('todos')">Todos<span class="sc">${CL.length}</span></button>
        <button class="stab sg${curTab==='tengo'?' active':''}" onclick="setTab('tengo')">✅ Tengo<span class="sc">${owned.length}</span></button>
        <button class="stab sf${curTab==='faltan'?' active':''}" onclick="setTab('faltan')">❌ Faltan<span class="sc">${missing.length}</span></button>
        <button class="stab sr${curTab==='repes'?' active':''}" onclick="setTab('repes')">🔄 Repes<span class="sc">${extras}</span></button>
      </div>
      <div class="rcount">${filtered.length} cromos</div>
    </div>
    <div class="lista">
      ${filtered.map(c=>{
        const qty=col[c.id]||0;const ow=qty>0;const re=qty>1;
        return`<div class="litem${ow?' owned':''}">
          <div class="inum" style="color:${TYPE_COLOR[c.type]||'#fff'}">${c.id}</div>
          <div class="iinfo">
            <div class="iname">${c.name}</div>
            <div class="isub"><span>${c.team}</span><span class="tbadge" style="background:${TYPE_COLOR[c.type]}22;color:${TYPE_COLOR[c.type]}">${TYPE_LABEL[c.type]}</span></div>
          </div>
          ${re?`<span class="rbadge">+${qty-1}</span>`:''}
          <div class="ibtns">
            <button class="cbtn" style="background:${ow?'#dc2626':'#334155'}" onclick="removeCard(${c.id})">−</button>
            <span class="cqty" style="color:${ow?'#34d399':'#475569'}">${qty}</span>
            <button class="cbtn" style="background:#16a34a" onclick="addCard(${c.id})">+</button>
          </div>
        </div>`;
      }).join('')}
    </div>`:''}

    <div class="bottom-bar">
      <button class="bbtn imp" onclick="openImport()">📤 Importar</button>
      <button class="bbtn exp" onclick="exportExcel()">📥 Exportar</button>
    </div>

    ${activeModal?`<div class="overlay" onclick="closeModal()">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="mhead">
          <div>
            <div class="mtitle">${activeModal.id} · ${activeModal.name}</div>
            <div class="msub">${activeModal.team} · <span style="color:${TYPE_COLOR[activeModal.type]}">${TYPE_LABEL[activeModal.type]}</span></div>
          </div>
          <button class="mclose" onclick="closeModal()">✕</button>
        </div>
        <div class="qty-row">
          <button class="qbtn" style="background:#dc2626" onclick="removeCard(${activeModal.id});updateModalQty()">−</button>
          <div class="qdisplay">
            <div class="qnum" style="color:${(col[activeModal.id]||0)>0?'#34d399':'#64748b'}" id="modalQty">${col[activeModal.id]||0}</div>
            <div class="qlabel" id="modalLabel">${(col[activeModal.id]||0)===0?'No tengo':(col[activeModal.id]||0)===1?'Tengo 1':`Tengo 1 + ${(col[activeModal.id]||0)-1} repe`}</div>
          </div>
          <button class="qbtn" style="background:#16a34a" onclick="addCard(${activeModal.id});updateModalQty()">+</button>
        </div>
      </div>
    </div>`:''}

    ${showImport?`<div class="overlay" onclick="closeImport()">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="mhead"><div class="mtitle">📤 Importar Excel</div><button class="mclose" onclick="closeImport()">✕</button></div>
        <div class="mdesc">El archivo debe tener columnas <b>Nº</b> y <b>Cantidad</b>.<br>Exporta primero para obtener el formato correcto.</div>
        <input type="file" accept=".xlsx,.xls,.xlsm" id="fileInput" style="display:none" onchange="handleFile(this)">
        <button class="mbtn primary" onclick="document.getElementById('fileInput').click()">Seleccionar archivo...</button>
        <button class="mbtn secondary" onclick="closeImport()">Cancelar</button>
      </div>
    </div>`:''}
  `;
}

// ── HELPERS ──────────────────────────────────────────────────
function setView(v){
  curView=v;
  render();
  if(v==='sobre') setTimeout(renderSobrePanel,50);
  if(v==='cambio') setTimeout(renderCambioPanel,50);
}
function setTab(t){curTab=t;render();}
function setSearch(v){curSearch=v;render();}
function setTeam(v){curTeam=v;render();}
function togglePrefsPanel(){showPrefs=!showPrefs;render();}
function openModal(id){activeModal=CL.find(c=>c.id===id);render();}
function closeModal(){activeModal=null;render();}
function openImport(){showImport=true;render();}
function closeImport(){showImport=false;render();}
function handleFile(input){if(input.files[0])importExcel(input.files[0]);}
function updateModalQty(){
  const q=document.getElementById('modalQty');
  const l=document.getElementById('modalLabel');
  if(q&&activeModal){
    const qty=col[activeModal.id]||0;
    q.textContent=qty;
    q.style.color=qty>0?'#34d399':'#64748b';
    l.textContent=qty===0?'No tengo':qty===1?'Tengo 1':`Tengo 1 + ${qty-1} repe`;
  }
}

// Expose functions to window for onclick handlers
window.setView=setView; window.setTab=setTab; window.setSearch=setSearch;
window.setTeam=setTeam; window.togglePrefsPanel=togglePrefsPanel;
window.openModal=openModal; window.closeModal=closeModal;
window.openImport=openImport; window.closeImport=closeImport;
window.handleFile=handleFile; window.updateModalQty=updateModalQty;
window.addCard=addCard; window.removeCard=removeCard;
window.sobreBuscar=sobreBuscar; window.sobreConfirmar=sobreConfirmar; window.sobreClear=sobreClear; window.sobreUndo=sobreUndo;
window.cambioNext=cambioNext; window.cambioConfirm=cambioConfirm; window.cambioReset=cambioReset; window.cambioPrevisualize=cambioPrevisualize; window.cambioSetInput=cambioSetInput; window.sobreSetInput=sobreSetInput;
window.exportExcel=exportExcel; window.togglePref=togglePref;

// ── INIT ──────────────────────────────────────────────────────
const savedPrefs=localStorage.getItem('adrenalyn2026_prefs');
if(savedPrefs) prefs=JSON.parse(savedPrefs);
document.getElementById('app').innerHTML='<div class="loading"><div class="loading-icon">⚽</div><div>Cargando colección...</div></div>';
loadFromFirebase().then(()=>render());
</script>
<style>
:root{--bg:#0a0f1e;--bg2:#111827;--bg3:#1e293b;--bg4:#162032;--accent:#2563eb;--green:#10b981;--red:#ef4444;--yellow:#f59e0b;--text:#f1f5f9;--muted:#64748b;--border:#1e293b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

.header-name{font-size:17px;font-weight:800}

.progress-bar{height:5px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden;margin-bottom:10px}

.view-tabs{display:flex;gap:6px}

.vtab.active{background:var(--accent);color:#fff}
.vtab.vset{flex:0 0 42px}
.vtab.vset.active{background:#475569}
.sync-status{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:#94a3b8;margin-top:3px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.sync-dot.syncing{background:var(--yellow);animation:pulse 1s infinite}
.sync-dot.error{background:var(--red)}
.sync-dot.loading{background:#94a3b8}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.prefs-panel{background:var(--bg2);padding:12px 16px;border-bottom:1px solid var(--border)}
.prefs-title{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px;letter-spacing:.5px}
.pref-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;cursor:pointer}
.checkbox{width:22px;height:22px;border-radius:6px;border:2px solid #475569;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;transition:all .2s}
.checkbox.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pref-label{font-size:14px}
.checklist{padding:10px 10px 130px}
.team-block{margin-bottom:12px}

.team-count{font-size:12px;font-weight:700;color:var(--muted)}
.team-count.full{color:var(--green)}

.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 7px;border-radius:8px;border:none;cursor:pointer;font-size:12px;transition:all .15s;background:var(--bg3);color:var(--muted);font-weight:400}
.chip.owned{background:#052e16;color:#4ade80;font-weight:700}
.chip.duped{background:#422006;color:#fbbf24;font-weight:700}
.sbox{width:16px;height:16px;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;border:2px solid #334155;background:transparent;color:transparent}
.chip.owned .sbox{background:#16a34a;border-color:#16a34a;color:#fff}
.chip.duped .sbox{background:var(--yellow);border-color:var(--yellow);color:#000}
.xbadge{background:#92400e;color:#fcd34d;border-radius:4px;padding:0 4px;font-size:10px}
.lista-controls{padding:10px 12px 0}
.search-input{width:100%;padding:10px 14px;border-radius:12px;border:none;background:var(--bg3);color:var(--text);font-size:14px;outline:none}
.team-select{width:100%;margin-top:7px;padding:9px 12px;border-radius:12px;border:none;background:var(--bg3);color:var(--text);font-size:13px;outline:none}
.subtabs{display:flex;gap:6px;margin-top:8px}
.stab{flex:1;padding:8px 4px;border-radius:12px;border:none;cursor:pointer;font-weight:700;font-size:11px;background:var(--bg3);color:#94a3b8;transition:all .2s}
.stab .sc{font-size:15px;font-weight:900;display:block}
.stab.active{color:#fff}
.stab.st.active{background:#475569}
.stab.sg.active{background:var(--green)}

.stab.sr.active{background:var(--yellow)}

.lista{padding:4px 10px 130px}

.litem.owned{border-left-color:var(--green)}
.inum{min-width:34px;text-align:center;font-size:15px;font-weight:900}
.iinfo{flex:1;min-width:0}
.iname{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.isub{font-size:11px;color:var(--muted);display:flex;gap:5px;margin-top:1px;align-items:center}
.tbadge{padding:0 4px;border-radius:4px;font-weight:600;font-size:10px}
.rbadge{background:var(--yellow);color:#000;font-weight:900;font-size:11px;padding:1px 6px;border-radius:6px;flex-shrink:0}
.ibtns{display:flex;align-items:center;gap:4px;flex-shrink:0}
.cbtn{width:32px;height:32px;border-radius:8px;border:none;color:#fff;font-size:20px;cursor:pointer;font-weight:900;display:flex;align-items:center;justify-content:center}
.cqty{min-width:18px;text-align:center;font-weight:900;font-size:14px}
.bottom-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#060b17;border-top:1px solid var(--border);padding:8px 12px 20px;display:flex;gap:8px;z-index:50}
.bbtn{flex:1;padding:11px;border-radius:11px;border:none;font-weight:700;font-size:13px;cursor:pointer}
.bbtn.imp{background:var(--bg3);color:#94a3b8}
.bbtn.exp{background:var(--accent);color:#fff}

.mhead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.mtitle{font-weight:900;font-size:17px}
.msub{font-size:12px;color:var(--muted);margin-top:3px}
.mclose{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer}
.qty-row{display:flex;align-items:center;justify-content:center;gap:24px;margin-bottom:20px}
.qbtn{width:52px;height:52px;border-radius:14px;border:none;color:#fff;font-size:28px;cursor:pointer;font-weight:900}
.qdisplay{text-align:center}
.qnum{font-size:40px;font-weight:900}
.qlabel{font-size:11px;color:var(--muted);margin-top:2px}
.mdesc{color:#94a3b8;font-size:13px;margin-bottom:16px;line-height:1.5}
.mbtn{width:100%;padding:13px;border-radius:12px;border:none;font-weight:700;font-size:15px;cursor:pointer;margin-bottom:10px}
.mbtn.primary{background:var(--accent);color:#fff}
.mbtn.secondary{background:var(--bg3);color:#94a3b8}
.toast{position:fixed;top:68px;left:50%;transform:translateX(-50%);background:var(--bg2);color:#fff;padding:9px 20px;border-radius:12px;font-size:13px;font-weight:600;z-index:200;border:1px solid var(--border);white-space:nowrap;pointer-events:none;display:none}
.loading{display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:16px}
.loading-icon{font-size:52px;animation:bounce .8s infinite alternate}
.footer-emm{text-align:center;padding:20px 0 8px;font-size:11px;color:#334155;font-weight:600;letter-spacing:.05em}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-10px)}}
</style>
</head>

<div id="app"><div class="loading"><div class="loading-icon">⚽</div><div>Cargando colección...</div></div></div>
